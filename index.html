<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>GridQueue</title>
        <!-- Test page: renders answers, tables, charts and maps. The real frontend comes later. -->
        <script src="/static/vendor/vega.min.js"></script>
        <script src="/static/vendor/vega-lite.min.js"></script>
        <script src="/static/vendor/vega-embed.min.js"></script>
        <script src="/static/vendor/marked.umd.js"></script>
        <style>
            * { box-sizing: border-box; margin: 0; padding: 0; }
            body { font-family: system-ui, sans-serif; display: flex; justify-content: center; padding: 2rem 1rem; }
            #container { width: 100%; max-width: 980px; display: flex; flex-direction: column; border: 1px solid #e0e0e0; }
            #messages { overflow-y: auto; padding: 1.5rem 2rem; display: flex; flex-direction: column; gap: 1.25rem;
                        min-height: 450px; max-height: 78vh; }
            .msg { line-height: 1.55; max-width: 100%; }
            .msg.user { align-self: flex-end; text-align: right; max-width: 80%; }
            .msg .role { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #999; margin-bottom: 0.25rem; }
            .msg.loading .content { color: #999; }
            .content p, .content ul { margin: 0.5rem 0; } .content ul { padding-left: 1.25rem; }
            .content table { border-collapse: collapse; margin: 0.75rem 0 0.25rem; font-size: 0.85rem; }
            .content th, .content td { border-bottom: 1px solid #eee; padding: 0.3rem 0.6rem; }
            .content th { cursor: pointer; background: #fafafa; text-align: left; }
            .viz { width: 100%; margin: 0.75rem 0; }
            .tools { font-size: 0.75rem; margin-bottom: 0.75rem; display: flex; gap: 0.75rem; }
            .tools a { color: #b45309; cursor: pointer; text-decoration: underline; }
            .sql { display: none; font-family: ui-monospace, monospace; font-size: 0.75rem; background: #f5f5f5;
                   padding: 0.5rem; white-space: pre-wrap; margin-bottom: 0.75rem; }
            #input-area { display: flex; gap: 1rem; padding: 1.25rem; border-top: 1px solid #e0e0e0; }
            #user-input { flex: 1; padding: 0.75rem 0; border: none; border-bottom: 1px solid #e0e0e0; font-size: 1rem; outline: none; }
            button { padding: 0.75rem 1.5rem; background: #000; color: #fff; border: none; font-size: 0.75rem;
                     text-transform: uppercase; letter-spacing: 0.05em; cursor: pointer; }
            button:disabled { opacity: 0.3; }
            details.tool { font-family: ui-monospace, monospace; font-size: 0.72rem; color: #555; background: #f7f7f7;
                           border-left: 3px solid #f59e0b; padding: 0.35rem 0.75rem; margin: 0.15rem 0; white-space: pre-wrap; word-break: break-word; }
            details.tool summary { cursor: pointer; }
            .tool .agent { color: #b45309; text-transform: uppercase; letter-spacing: 0.05em; }
        </style>
    </head>
    <body>
        <div id="container">
            <div id="messages"></div>
            <div id="input-area">
                <input type="text" id="user-input" placeholder="Ask about US grid interconnection queues..." autocomplete="off" />
                <button id="send-btn">Send</button>
            </div>
        </div>
        <script>
            const messages = document.getElementById("messages");
            const userInput = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");
            const MARKER = /<!--gq:(table|chart|map):(\d+)-->/g;
            let sessionId = null;

            function escapeHtml(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

            function addMessage(role, text, isLoading = false) {
                const div = document.createElement("div");
                div.className = "msg " + (role === "you" ? "user" : "assistant") + (isLoading ? " loading" : "");
                div.innerHTML = '<div class="role"></div><div class="content"></div>';
                div.querySelector(".role").textContent = role;
                div.querySelector(".content").textContent = text;
                messages.appendChild(div);
                messages.scrollTop = messages.scrollHeight;
                return div;
            }

            function addToolCall(call, before) {
                const d = document.createElement("details");
                d.className = "tool";
                const s = document.createElement("summary");
                const a = document.createElement("span"); a.className = "agent"; a.textContent = (call.agent || "") + "  ";
                s.append(a, document.createTextNode(call.name));
                d.append(s, document.createTextNode(JSON.stringify(call.args, null, 1) + "\n→ " + call.result));
                messages.insertBefore(d, before);
            }

            function csv(columns, rows) {
                const q = (v) => (v === null ? "" : /[",\n]/.test(String(v)) ? '"' + String(v).replace(/"/g, '""') + '"' : String(v));
                return [columns.map(q).join(",")].concat(rows.map((r) => r.map(q).join(","))).join("\n");
            }

            function sortable(table) {
                table.querySelectorAll("th").forEach((th, i) => th.addEventListener("click", () => {
                    const body = table.tBodies[0], rows = Array.from(body.rows);
                    const asc = th.dataset.asc !== "1"; th.dataset.asc = asc ? "1" : "0";
                    const val = (r) => { const t = r.cells[i].textContent.replace(/[,$%]/g, ""); const n = parseFloat(t); return isNaN(n) ? t : n; };
                    rows.sort((a, b) => (val(a) > val(b) ? 1 : val(a) < val(b) ? -1 : 0) * (asc ? 1 : -1));
                    rows.forEach((r) => body.appendChild(r));
                }));
            }

            function tableTools(holder, v) {
                const tools = document.createElement("div"); tools.className = "tools";
                const dl = document.createElement("a"); dl.textContent = "Download CSV";
                dl.onclick = () => { const b = new Blob([csv(v.columns, v.rows)], { type: "text/csv" });
                    dl.href = URL.createObjectURL(b); dl.download = (v.title || "gridqueue") + ".csv"; };
                const sq = document.createElement("a"); sq.textContent = "Show SQL";
                const pre = document.createElement("div"); pre.className = "sql"; pre.textContent = v.sql;
                sq.onclick = () => { pre.style.display = pre.style.display === "block" ? "none" : "block"; };
                tools.append(dl, sq); holder.append(tools, pre);
            }

            function renderAnswer(el, text, toolCalls) {
                const visuals = {};
                for (const c of toolCalls) if (c.visual) visuals[c.visual.marker] = c.visual;
                // Markers become placeholders; everything else is escaped before markdown (no raw HTML).
                const safe = escapeHtml(text.replace(MARKER, (m) => "\n\n@@" + m.slice(4, -3) + "@@\n\n"));
                el.innerHTML = marked.parse(safe);
                el.querySelectorAll("table").forEach(sortable);
                el.querySelectorAll("p").forEach((p) => {
                    const m = p.textContent.trim().match(/^@@gq:(table|chart|map):(\d+)@@$/);
                    if (!m) return;
                    const v = visuals[`<!--gq:${m[1]}:${m[2]}-->`];
                    const holder = document.createElement("div");
                    p.replaceWith(holder);
                    if (!v) return;
                    if (v.kind === "table") { tableTools(holder, v); return; }
                    const box = document.createElement("div"); box.className = "viz"; holder.append(box);
                    vegaEmbed(box, v.spec, { actions: { export: true, source: false, compiled: false, editor: false } })
                        .catch((e) => { box.textContent = "Chart failed to render: " + e.message; });
                    const pre = document.createElement("div");
                    pre.className = "sql"; pre.textContent = v.sql;
                    const tools = document.createElement("div"); tools.className = "tools";
                    const sq = document.createElement("a"); sq.textContent = "Show SQL";
                    sq.onclick = () => { pre.style.display = pre.style.display === "block" ? "none" : "block"; };
                    tools.append(sq); holder.append(tools, pre);
                });
            }

            async function send() {
                const text = userInput.value.trim();
                if (!text) return;
                userInput.value = ""; sendBtn.disabled = true;
                addMessage("you", text);
                const loading = addMessage("assistant", "Working (planning, querying, checking)...", true);
                try {
                    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" },
                                                     body: JSON.stringify({ message: text, session_id: sessionId }) });
                    const data = await res.json();
                    sessionId = data.session_id;
                    for (const call of data.tool_calls || []) addToolCall(call, loading);
                    renderAnswer(loading.querySelector(".content"), data.response, data.tool_calls || []);
                } catch (e) {
                    loading.querySelector(".content").textContent = "Error: " + e.message;
                }
                loading.classList.remove("loading"); sendBtn.disabled = false; userInput.focus();
            }

            sendBtn.addEventListener("click", send);
            userInput.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
            userInput.focus();
        </script>
    </body>
</html>
